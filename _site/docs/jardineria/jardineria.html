<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="/me/assets/images/favicon.ico">
  <title>Jardinería | edudedu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/me/assets/css/styles.css">
</head>
<body class="markdown-body">
  <header>
    <a href="/me/">edudedu</a>
  </header>

  <main>
    <h1 id="jardinería">Jardinería</h1>

<h2 id="contenidos">Contenidos</h2>

<ul>
  <li><a href="/me/docs/jardineria/suculentas.html">Suculentas</a></li>
</ul>

  </main>

  <aside id="toc"></aside>

  <footer>
    <p>&copy; 2026 — edudedu</p>
  </footer>
</body>
<script>
  const toc = document.getElementById("toc");
  const headings = document.querySelectorAll("h1, h2, h3");

  headings.forEach((h, i) => {
    const id = "heading-" + i;
    h.id = id;

    const a = document.createElement("a");
    a.href = "#" + id;
    a.textContent = h.textContent;

    if (h.tagName === "H2") a.style.marginLeft = "10px";
    if (h.tagName === "H3") a.style.marginLeft = "20px";

    toc.appendChild(a);
  });
</script>
<script>
  const links = document.querySelectorAll("#toc a");

  window.addEventListener("scroll", () => {
    let current = "";

    document.querySelectorAll("h1, h2, h3").forEach((section) => {
      const sectionTop = section.offsetTop;
      if (scrollY >= sectionTop - 100) {
        current = section.getAttribute("id");
      }
    });

    links.forEach((a) => {
      a.classList.remove("active");
      if (a.getAttribute("href") === "#" + current) {
        a.classList.add("active");
      }
    });
  });
</script>
<script>
  function typeEffect(element, speed = 40) {
    const text = element.textContent;
    element.textContent = "";
    element.classList.add("typing");

    let i = 0;

    function typing() {
      if (i < text.length) {
        element.textContent += text.charAt(i);
        i++;
        setTimeout(typing, speed);
      } else {
        element.classList.remove("typing");
      }
    }

    typing();
  }

  // solo aplicar al h1
  const title = document.querySelector("h1");
  if (title) typeEffect(title);
</script>
</html>
